name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build (MSVC, x64)
        run: |
          cmake -S windows -B build -A x64
          cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/Release/Moveable.exe -DestinationPath dist/Moveable-Windows-x64.zip -Force

      - uses: actions/upload-artifact@v7
        with:
          name: Moveable-Windows-x64
          path: dist/Moveable-Windows-x64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} dist/Moveable-Windows-x64.zip --clobber

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build (universal)
        run: ./build.sh --release

      - uses: actions/upload-artifact@v7
        with:
          name: Moveable-macOS
          path: dist/Moveable.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} dist/Moveable.zip --clobber
