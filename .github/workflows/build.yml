name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} != VERSION $v" }

      - name: Build (MSVC, x64)
        run: |
          cmake -S windows -B build -A x64
          cmake --build build --config Release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Package (zip + installer)
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/Release/Moveable.exe -DestinationPath dist/Moveable-Windows-x64.zip -Force
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$v" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist
          (Get-Item build/Release/Moveable.exe).VersionInfo | Format-List FileVersion, ProductVersion

      - uses: actions/upload-artifact@v7
        with:
          name: Moveable-Windows
          path: |
            dist/Moveable-Setup.exe
            dist/Moveable-Windows-x64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} dist/Moveable-Setup.exe dist/Moveable-Windows-x64.zip --clobber

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          [ "v$v" = "${{ github.ref_name }}" ] || { echo "Tag ${{ github.ref_name }} != VERSION $v"; exit 1; }

      - name: Build (universal app, pkg + zip)
        run: ./build.sh --release

      - uses: actions/upload-artifact@v7
        with:
          name: Moveable-macOS
          path: |
            dist/Moveable.pkg
            dist/Moveable.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} dist/Moveable.pkg dist/Moveable.zip --clobber
