<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  body { font: 13px -apple-system, "Apple SD Gothic Neo", sans-serif; color: #1b2233; line-height: 1.6; }
  h2 { font-size: 17px; margin: 0 0 8px; }
  kbd { font: 12px ui-monospace, Menlo, monospace; background: #f2efe6; border: 1px solid #d6d0bc; border-radius: 4px; padding: 1px 5px; }
  li { margin: 4px 0; }
  .muted { color: #767f8f; }
</style></head>
<body>
  <h2>Moveable 설치</h2>
  <p>키보드로 지금 선택된 창을 부드럽게 옮기고 크기를 바꾸는 메뉴바 앱입니다.</p>
  <ul>
    <li><kbd>⌃</kbd> <kbd>⌥</kbd> <kbd>⇧</kbd> + 방향키 — 창 이동</li>
    <li><kbd>⌥</kbd> <kbd>⇧</kbd> + 방향키 — 창 크기 조절 (왼쪽 위 고정)</li>
  </ul>
  <p>Moveable은 <b>응용 프로그램</b> 폴더에 설치되고, 설치가 끝나면 바로 실행됩니다.</p>
  <p class="muted">설치 후 <b>시스템 설정 → 개인정보 보호 및 보안 → 손쉬운 사용</b>에서 Moveable을 한 번 켜 주세요.</p>
</body></html>
